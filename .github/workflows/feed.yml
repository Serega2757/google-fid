name: Generate Feed

on:
  schedule:

    # 21:00 UTC
    # 23:00 Київ (зима)
    # 00:00 Київ (літо)

    - cron: '0 21 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate feed
        run: npm run generate

      - name: Commit feed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add feed.xml

          git diff --quiet && git diff --staged --quiet || git commit -m "Update feed"

          git push
